<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#004499"/>
      <stop offset="100%" stop-color="#0066CC"/>
    </linearGradient>
    <linearGradient id="pyramid" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.25)"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="rgba(52,211,153,0.4)"/>
      <stop offset="100%" stop-color="rgba(52,211,153,0)"/>
    </radialGradient>
    <!-- Breathing pulse rings -->
    <radialGradient id="pulse1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="60%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="80%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="627" fill="url(#bg)"/>

  <!-- Subtle breathing rings -->
  <circle cx="600" cy="260" r="200" fill="url(#pulse1)"/>
  <circle cx="600" cy="260" r="140" fill="url(#pulse1)"/>

  <!-- Pyramid — larger, centered -->
  <polygon points="200,440 600,100 1000,440" fill="url(#pyramid)" stroke="rgba(255,255,255,0.35)" stroke-width="2.5"/>

  <!-- Inhale path hint -->
  <path d="M220,425 L585,115" stroke="rgba(52,211,153,0.35)" stroke-width="2" stroke-dasharray="8,5" fill="none"/>
  <!-- Exhale path hint -->
  <path d="M615,115 L980,425" stroke="rgba(96,165,250,0.35)" stroke-width="2" stroke-dasharray="8,5" fill="none"/>

  <!-- Ball glow -->
  <circle cx="410" cy="270" r="50" fill="url(#glow)"/>
  <!-- Ball -->
  <circle cx="410" cy="270" r="28" fill="url(#ball)"/>
  <circle cx="404" cy="263" r="8" fill="rgba(255,255,255,0.4)"/>

  <!-- Labels on pyramid sides -->
  <text x="370" y="470" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="rgba(255,255,255,0.55)">Einatmen</text>
  <text x="830" y="470" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="rgba(255,255,255,0.55)">Ausatmen</text>

  <!-- Title -->
  <text x="600" y="530" text-anchor="middle" font-family="system-ui,sans-serif" font-size="42" font-weight="700" fill="white" letter-spacing="-0.5">HRV-Atemübung</text>
  <text x="600" y="568" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="rgba(255,255,255,0.8)">Interaktive Resonanzatmung mit visueller Führung</text>

  <!-- Branding -->
  <text x="600" y="600" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.45)">1stai.eu</text>
</svg>
